apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
      - name: harbor-pull
      containers:
      - name: frontend
        image: 192.168.65.132:8085/portfolio/frontend:1.0.0
        ports:
        - containerPort: 3000
        env:
        - name: API_URL
          value: "http://api:3001"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
