---
- name: Installer les prérequis
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Créer le dossier des clés APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Télécharger la clé GPG officielle de Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Ajouter le dépôt APT de Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Installer Docker Engine et le plugin Docker Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Démarrer et activer le service Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Autoriser l'utilisateur de déploiement à utiliser Docker
  ansible.builtin.user:
    name: "{{ deploy_user | default('vagrant') }}"
    groups: docker
    append: true

- name: Vérifier la version de Docker
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false

- name: Vérifier la version de Docker Compose
  ansible.builtin.command: docker compose version
  register: compose_version
  changed_when: false

- name: Afficher les versions installées
  ansible.builtin.debug:
    msg:
      - "{{ docker_version.stdout }}"
      - "{{ compose_version.stdout }}"
